<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CzechMate">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>CzechMate 捷適旅</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#F5F3EB">
<style>
/* Layout: single phone-width column (max 430px) with sticky top bar and sticky bottom tab bar; sheets slide up for forms. Tokens follow CzechMate_UI_Spec v1.1. */
:root {
  --background: #F5F3EB;
  --surface: #FFFFFF;
  --surface-subtle: #ECEAE1;
  --text-primary: #243229;
  --text-secondary: #59665B;
  --border: #DAD7CD;
  --primary: #344E41;
  --primary-text: #FFFFFF;
  --sage: #A3B18A;
  --sage-surface: #E3E8D9;
  --accent-travel: #A64B3C;
  --accent-travel-surface: #F2E3DC;
  --travel-cream: #F7F1E7;
  --travel-coffee: #493A32;
  --success: #18794E;
  --warning: #986A12;
  --warning-surface: #F6ECD4;
  --error: #B93838;
  --info: #326DA8;
  --mark: #E9DFB8;
  --scrim: rgba(23, 33, 27, .45);
  --cat1: #344E41; --cat2: #8C9C72; --cat3: #A64B3C; --cat4: #C9A87F;
  --cat5: #493A32; --cat6: #326DA8; --cat7: #986A12; --cat8: #6F8F87; --cat9: #B7705C; --cat10: #9A9A8E;
  --font: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  --r-card: 14px; --r-ctl: 11px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --background: #17211B; --surface: #222E26; --surface-subtle: #2C3A30;
    --text-primary: #F5F3EB; --text-secondary: #C5CEC2; --border: #405044;
    --primary: #A3B18A; --primary-text: #17211B; --sage: #A3B18A; --sage-surface: #34442F;
    --accent-travel: #E08A76; --accent-travel-surface: #432D29; --travel-cream: #2E2724; --travel-coffee: #E8D6C4;
    --success: #72C69A; --warning: #E5C16B; --warning-surface: #3A3220; --error: #FF8B8B; --info: #8CBDF0;
    --mark: #5A5230; --scrim: rgba(0, 0, 0, .6);
    --cat1: #A3B18A; --cat2: #6F9A6E; --cat3: #E08A76; --cat4: #D8BFA0;
    --cat5: #C29B83; --cat6: #8CBDF0; --cat7: #E5C16B; --cat8: #8FB8AE; --cat9: #D7A08C; --cat10: #8E968C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --background: #17211B; --surface: #222E26; --surface-subtle: #2C3A30;
  --text-primary: #F5F3EB; --text-secondary: #C5CEC2; --border: #405044;
  --primary: #A3B18A; --primary-text: #17211B; --sage: #A3B18A; --sage-surface: #34442F;
  --accent-travel: #E08A76; --accent-travel-surface: #432D29; --travel-cream: #2E2724; --travel-coffee: #E8D6C4;
  --success: #72C69A; --warning: #E5C16B; --warning-surface: #3A3220; --error: #FF8B8B; --info: #8CBDF0;
  --mark: #5A5230; --scrim: rgba(0, 0, 0, .6);
  --cat1: #A3B18A; --cat2: #6F9A6E; --cat3: #E08A76; --cat4: #D8BFA0;
  --cat5: #C29B83; --cat6: #8CBDF0; --cat7: #E5C16B; --cat8: #8FB8AE; --cat9: #D7A08C; --cat10: #8E968C;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--background); color: var(--text-primary); font-family: var(--font); font-size: 15px; line-height: 1.5; -webkit-tap-highlight-color: transparent; }
* { box-sizing: border-box; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.app { max-width: 430px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; background: var(--background); }
@media (min-width: 560px) { .app { border-inline: 1px solid var(--border); } }

.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--background); padding-block: 12px 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; align-items: center; gap: 8px; border-bottom: 1px solid transparent; }
.topbar h1 { font-size: 24px; font-weight: 600; margin: 0; flex: 1; text-wrap: balance; }
.topbar .sub { font-size: 12px; color: var(--text-secondary); font-weight: 400; display: block; letter-spacing: .02em; }
.iconbtn { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); display: grid; place-items: center; }
.iconbtn svg { width: 22px; height: 22px; }

main { flex: 1; padding-block: 4px 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 20px; }
section { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.sec-h h2 { font-size: 18px; font-weight: 600; margin: 0; }
.sec-h .link { font-size: 13px; color: var(--primary); background: none; border: 0; padding: 6px 0; }
.muted { color: var(--text-secondary); }
.small { font-size: 13px; }
.tiny { font-size: 12px; }

.tabs { position: sticky; bottom: 0; z-index: 5; background: var(--surface); border-top: 1px solid var(--border); display: grid; grid-template-columns: repeat(4, 1fr); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.tabs button { background: none; border: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 0 6px; font-size: 11px; color: var(--text-secondary); min-height: 54px; }
.tabs button svg { width: 24px; height: 24px; }
.tabs button[aria-current="page"] { color: var(--primary); font-weight: 600; }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-card); padding: 14px 16px; }
.banner { display: flex; align-items: center; gap: 10px; background: var(--warning-surface); color: var(--text-primary); border-radius: 12px; padding: 10px 12px; font-size: 14px; border: 0; text-align: left; width: 100%; }
.banner svg { width: 20px; height: 20px; color: var(--warning); flex: none; }
.banner b { color: var(--warning); font-weight: 600; }
.banner .go { margin-left: auto; color: var(--text-secondary); font-size: 13px; white-space: nowrap; }

.pins { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.pin { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 10px 4px 8px; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; min-height: 76px; }
.pin .ico { width: 34px; height: 34px; border-radius: 10px; background: var(--sage-surface); color: var(--primary); display: grid; place-items: center; font-weight: 700; font-size: 13px; letter-spacing: .02em; }
.pin span:last-child { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-inline: 4px; }

.summary { display: flex; flex-direction: column; gap: 10px; }
.summary .big { font-size: 30px; font-weight: 700; line-height: 1.1; }
.summary .big small { font-size: 15px; font-weight: 500; color: var(--text-secondary); margin-right: 4px; }
.bar { display: flex; height: 10px; border-radius: 6px; overflow: hidden; background: var(--surface-subtle); }
.bar i { display: block; height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none; }

.btn { min-height: 46px; border-radius: var(--r-ctl); border: 1px solid transparent; padding: 0 18px; font-weight: 600; font-size: 16px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn-primary { background: var(--primary); color: var(--primary-text); }
.btn-secondary { background: var(--surface-subtle); color: var(--primary); }
.btn-danger { background: none; color: var(--error); border-color: var(--error); }
.btn-block { width: 100%; }
.btn svg { width: 20px; height: 20px; }

.list { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-card); overflow: hidden; }
.row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 0; border-top: 1px solid var(--border); background: none; text-align: left; width: 100%; min-height: 56px; }
.row:first-child { border-top: 0; }
.row .main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.row .t { font-size: 15px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .m { font-size: 12px; color: var(--text-secondary); display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }
.row .amt { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; flex: none; }
.row .amt b { font-size: 15px; font-weight: 600; }
.row .amt span { font-size: 12px; color: var(--text-secondary); }
.row .amt .pending { color: var(--warning); font-weight: 600; }
.caticon { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; flex: none; color: #fff; font-size: 13px; font-weight: 700; }
.day-h { display: flex; justify-content: space-between; font-size: 13px; color: var(--text-secondary); padding: 0 4px; margin-bottom: -4px; }

.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--surface-subtle); color: var(--text-secondary); white-space: nowrap; }
.chip.travel { background: var(--accent-travel-surface); color: var(--accent-travel); }
.chip.green { background: var(--sage-surface); color: var(--primary); }
.chip.warn { background: var(--warning-surface); color: var(--warning); }

.scroller { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; margin-inline: -16px; padding-inline: 16px; }
.scroller::-webkit-scrollbar { display: none; }
.fchip { flex: none; min-height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); font-size: 14px; color: var(--text-primary); }
.fchip[aria-pressed="true"] { background: var(--primary); color: var(--primary-text); border-color: var(--primary); }

.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface-subtle); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { min-height: 38px; border: 0; border-radius: 9px; background: none; font-size: 14px; color: var(--text-secondary); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--primary); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.seg.travel button[aria-pressed="true"] { color: var(--accent-travel); }

.search { position: relative; }
.search input { width: 100%; min-height: 46px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); padding: 0 40px 0 40px; font-size: 16px; }
.search input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--sage-surface); }
.search svg { position: absolute; left: 12px; top: 13px; width: 20px; height: 20px; color: var(--text-secondary); }
.search .clear { position: absolute; right: 4px; top: 4px; width: 38px; height: 38px; border: 0; background: none; color: var(--text-secondary); font-size: 18px; }

.res { display: flex; gap: 12px; padding: 14px; border: 1px solid var(--border); background: var(--surface); border-radius: var(--r-card); text-align: left; width: 100%; }
.res .ticon { width: 38px; height: 38px; border-radius: 10px; background: var(--sage-surface); color: var(--primary); display: grid; place-items: center; flex: none; }
.res .ticon svg { width: 20px; height: 20px; }
.res .ticon.book { background: var(--travel-cream); color: var(--travel-coffee); border: 1px solid var(--border); }
.res .body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
.res .t { font-weight: 500; font-size: 16px; display: flex; gap: 6px; align-items: center; }
.res .t svg { width: 14px; height: 14px; color: var(--text-secondary); flex: none; }
.res .p { font-size: 13px; color: var(--text-secondary); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.res .chips { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.res .date { font-size: 12px; color: var(--text-secondary); margin-left: auto; }
mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 1px; }
.group-h { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--text-secondary); letter-spacing: .04em; }
.group-h .n { font-weight: 400; }
.sync { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-secondary); }
.sync svg { width: 14px; height: 14px; color: var(--success); }

.fab { position: sticky; bottom: calc(66px + env(safe-area-inset-bottom, 0px)); align-self: flex-end; margin-right: max(16px, env(safe-area-inset-right, 0px)); margin-top: -70px; z-index: 4; height: 54px; border-radius: 16px; border: 0; padding: 0 18px 0 14px; background: var(--primary); color: var(--primary-text); font-weight: 600; font-size: 15px; display: flex; align-items: center; gap: 6px; box-shadow: 0 4px 14px rgba(36, 50, 41, .28); }
.fab svg { width: 22px; height: 22px; }
.fab-spacer { height: 64px; flex: none; }

.empty { text-align: center; padding: 28px 16px; color: var(--text-secondary); display: flex; flex-direction: column; gap: 12px; align-items: center; }

/* stock cards */
.stocks { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 10px; }
.stock { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-card); padding: 12px; display: flex; flex-direction: column; gap: 2px; }
.stock .cur { font-size: 12px; color: var(--text-secondary); letter-spacing: .06em; font-weight: 600; }
.stock .bal { font-size: 22px; font-weight: 700; }
.stock .avg { font-size: 12px; color: var(--text-secondary); }
.stock.neg .bal { color: var(--error); }

/* donut */
.donut-wrap { display: flex; gap: 16px; align-items: center; }
.donut { width: 140px; height: 140px; flex: none; }
.donut text { fill: var(--text-primary); }
.donut .lbl { fill: var(--text-secondary); font-size: 10px; }
.catlist { display: flex; flex-direction: column; gap: 8px; flex: 1; min-width: 0; font-size: 13px; }
.catlist div { display: flex; align-items: center; gap: 8px; }
.catlist .n { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.catlist .v { font-variant-numeric: tabular-nums; }
.catlist .pct { color: var(--text-secondary); width: 36px; text-align: right; font-variant-numeric: tabular-nums; }
@media (max-width: 360px) { .donut-wrap { flex-direction: column; align-items: stretch; } .donut { align-self: center; } }

.monthnav { display: flex; align-items: center; justify-content: space-between; }
.monthnav b { font-size: 17px; }
.monthnav button { width: 44px; height: 44px; border: 1px solid var(--border); background: var(--surface); border-radius: 12px; font-size: 18px; }
.monthnav button:disabled { opacity: .35; }

.trip { background: var(--travel-cream); border: 1px solid var(--border); border-radius: var(--r-card); padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; text-align: left; width: 100%; }
.trip .h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.trip .name { font-size: 17px; font-weight: 600; color: var(--travel-coffee); }
.trip .total { font-size: 20px; font-weight: 700; color: var(--accent-travel); }
.trip .meta { font-size: 13px; color: var(--text-secondary); display: flex; gap: 12px; flex-wrap: wrap; }

.pay { display: flex; flex-direction: column; gap: 6px; }
.pay .h { display: flex; justify-content: space-between; align-items: center; }
.pay .h b { font-size: 16px; }
.kv { display: flex; justify-content: space-between; font-size: 14px; gap: 8px; }
.kv span:first-child { color: var(--text-secondary); }
.fill { display: flex; gap: 8px; align-items: center; padding: 10px 14px; border-top: 1px solid var(--border); }
.fill .main { flex: 1; min-width: 0; font-size: 14px; }
.fill input { width: 96px; min-height: 40px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); padding: 0 8px; font-size: 16px; text-align: right; }
.fill button { min-height: 40px; border-radius: 10px; border: 0; background: var(--primary); color: var(--primary-text); padding: 0 12px; font-weight: 600; }

/* sheet */
.sheet { position: fixed; inset: 0; z-index: 20; background: var(--scrim); display: flex; align-items: flex-end; justify-content: center; }
.sheet .panel { width: 100%; max-width: 430px; max-height: calc(100% - 24px - env(safe-area-inset-top, 0px)); overflow-y: auto; background: var(--background); border-radius: 20px 20px 0 0; padding-block: 8px calc(20px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 16px; animation: up .22s ease-out; }
@keyframes up { from { transform: translateY(40px); opacity: .6; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .sheet .panel { animation: none; } }
.grab { width: 40px; height: 5px; border-radius: 3px; background: var(--border); margin: 0 auto; flex: none; }
.sheet-h { display: flex; align-items: center; gap: 8px; }
.sheet-h h2 { flex: 1; margin: 0; font-size: 18px; font-weight: 600; }
.sheet-h button { border: 0; background: none; color: var(--primary); min-height: 44px; padding: 0 4px; font-size: 16px; }
.form-travel { background: var(--travel-cream); }
.field { display: flex; flex-direction: column; gap: 6px; }
.field > label, .field > .lab { font-size: 13px; font-weight: 600; color: var(--text-secondary); }
.field input[type="text"], .field input[type="date"], .field input[type="number"], .field textarea, .field input[inputmode] { min-height: 46px; border-radius: var(--r-ctl); border: 1px solid var(--border); background: var(--surface); padding: 10px 12px; font-size: 16px; width: 100%; }
.field textarea { min-height: 84px; resize: vertical; }
.field input:focus, .field textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--sage-surface); }
.form-travel .field input:focus, .form-travel .field textarea:focus { border-color: var(--accent-travel); box-shadow: 0 0 0 3px var(--accent-travel-surface); }
.field .err { color: var(--error); font-size: 13px; display: flex; gap: 4px; align-items: center; }
.field.invalid input { border-color: var(--error); }
.amount-in { font-size: 32px !important; font-weight: 700; min-height: 60px !important; font-variant-numeric: tabular-nums; }
.opts { display: flex; flex-wrap: wrap; gap: 8px; }
.opt { min-height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); font-size: 14px; }
.opt[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: var(--primary-text); font-weight: 600; }
.form-travel .opt[aria-pressed="true"] { background: var(--accent-travel); border-color: var(--accent-travel); color: #fff; }
.form-travel .btn-primary { background: var(--accent-travel); color: #fff; }
:root[data-theme="dark"] .form-travel .btn-primary, :root[data-theme="dark"] .form-travel .opt[aria-pressed="true"] { color: #17211B; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .form-travel .btn-primary, :root:not([data-theme="light"]) .form-travel .opt[aria-pressed="true"] { color: #17211B; } }
.hint { font-size: 13px; color: var(--text-secondary); background: var(--surface-subtle); border-radius: 10px; padding: 8px 10px; }
.hint.warn { background: var(--warning-surface); color: var(--warning); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.actions { display: flex; gap: 10px; }
.actions .btn { flex: 1; }
.confirm { display: flex; flex-direction: column; gap: 8px; background: var(--surface); border: 1px solid var(--error); border-radius: 12px; padding: 12px; }

.detail h3 { font-size: 22px; margin: 0; font-weight: 600; text-wrap: balance; }
.detail .content { white-space: pre-wrap; line-height: 1.75; font-size: 15px; }
.detail a { color: var(--primary); word-break: break-all; }
.shot { border-radius: 12px; border: 1px solid var(--border); background: repeating-linear-gradient(135deg, var(--surface-subtle) 0 10px, var(--surface) 10px 20px); aspect-ratio: 9 / 12; max-width: 100%; width: 160px; display: grid; place-items: center; color: var(--text-secondary); font-size: 12px; }

.setgroup { display: flex; flex-direction: column; gap: 8px; }
.setgroup h3 { margin: 0; font-size: 13px; font-weight: 600; color: var(--text-secondary); letter-spacing: .04em; }
.setrow { display: flex; justify-content: space-between; align-items: center; gap: 8px; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(80px + env(safe-area-inset-bottom, 0px)); z-index: 30; background: var(--text-primary); color: var(--background); padding: 10px 16px; border-radius: 12px; font-size: 14px; max-width: calc(100% - 32px); box-shadow: 0 4px 16px rgba(0,0,0,.2); display: flex; gap: 8px; align-items: center; }
.toast svg { width: 18px; height: 18px; flex: none; }
.demo-note { font-size: 12px; color: var(--text-secondary); text-align: center; padding: 4px 0 0; }
</style>
</head>
<body>

  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const md = d => { const [, m, dd] = d.split('-'); return +m + '/' + +dd; };
  const ymd = d => d.replace(/-/g, '/');
  const ym = d => d.slice(0, 7);
  const ymLabel = s => { const [y, m] = s.split('-'); return y + ' 年 ' + +m + ' 月'; };
  const WEEK = ['日', '一', '二', '三', '四', '五', '六'];
  const wd = d => '週' + WEEK[new Date(d + 'T00:00:00').getDay()];
  const $ = s => document.querySelector(s);

  function toast(msg, ok) {
    const r = $('#toast-root');
    r.innerHTML = '<div class="toast" role="status">' + (ok === false ? I.alert : I.check) + '<span>' + esc(msg) + '</span></div>';
    clearTimeout(toast.t); toast.t = setTimeout(() => { r.innerHTML = ''; }, 2400);
  }

  /* ---------- shell ---------- */
  const TABS = [
    { id: 'home', name: '首頁', icon: I.home },
    { id: 'lib', name: '資源庫', icon: I.lib },
    { id: 'ledger', name: '記帳', icon: I.wallet },
    { id: 'stats', name: '統計', icon: I.chart }
  ];
  function renderTabs() {
    $('#tabs').innerHTML = TABS.map(t => '<button data-tab="' + t.id + '"' + (S.tab === t.id ? ' aria-current="page"' : '') + '>' + t.icon + '<span>' + t.name + '</span></button>').join('');
  }
  function setTop(title, sub, right) {
    $('#topbar').innerHTML = '<h1>' + (sub ? '<span class="sub">' + sub + '</span>' : '') + title + '</h1>' + (right || '');
  }
  function render() {
    recompute();
    renderTabs();
    const v = $('#view');
    if (S.tab === 'home') v.innerHTML = viewHome();
    else if (S.tab === 'lib') v.innerHTML = viewLib();
    else if (S.tab === 'ledger') v.innerHTML = viewLedger();
    else v.innerHTML = viewStats();
  }
  function go(tab) { S.tab = tab; render(); window.scrollTo(0, 0); }

  /* ---------- helpers ---------- */
  const pending = () => expenses.filter(e => e.src === '待補' && payOf(e.pay).type !== 'cash');
  function sumByCat(list) {
    const m = {};
    list.forEach(e => { if (e.twd != null) m[e.cat] = (m[e.cat] || 0) + e.twd; });
    return Object.entries(m).sort((a, b) => b[1] - a[1]);
  }
  const total = list => list.reduce((s, e) => s + (e.twd || 0), 0);
  function pendingNote(list) {
    const p = list.filter(e => e.src === '待補');
    if (!p.length) return '';
    const by = {};
    p.forEach(e => { by[e.cur] = (by[e.cur] || 0) + e.amt; });
    return '<span class="chip warn">' + I.alert.replace('<svg', '<svg width="12" height="12"') + ' 另有 ' + p.length + ' 筆刷卡待補（' + Object.entries(by).map(([c, a]) => fmt(a, c) + ' ' + c).join('、') + '）</span>';
  }
  function catIcon(cat) { return '<span class="caticon" style="background:' + catVar(cat) + '" aria-hidden="true">' + esc(cat.slice(0, 1)) + '</span>'; }
  function modeChip(m) {
    const mm = MODES.find(x => x.id === m);
    return '<span class="chip ' + (m === 'travel' ? 'travel' : m === 'prep' ? 'green' : '') + '">' + mm.name + '</span>';
  }
  function expRow(e) {
    const p = payOf(e.pay);
    const tw = e.cur === 'TWD' ? '' : (e.twd == null ? '<span class="pending">待補</span>' : '<span>≈ ' + twd(e.twd) + '</span>');
    return '<button class="row" data-edit="' + e.id + '">' + catIcon(e.cat) +
      '<span class="main"><span class="t">' + esc(e.name || e.cat) + '</span><span class="m">' + modeChip(e.mode) + '<span>' + esc(e.cat) + '</span><span>· ' + esc(p.name) + '</span>' +
      (e.trip ? '<span class="chip travel">' + esc(tripOf(e.trip).name) + '</span>' : '') + '</span></span>' +
      '<span class="amt num"><b>' + fmt(e.amt, e.cur) + ' <small>' + e.cur + '</small></b>' + tw + '</span></button>';
  }
  function donut(entries, center, sub) {
    const tot = entries.reduce((s, x) => s + x[1], 0);
    const r = 52, C = 2 * Math.PI * r;
    let off = 0, segs = '';
    entries.forEach(([cat, v]) => {
      const len = tot ? v / tot * C : 0;
      segs += '<circle cx="70" cy="70" r="' + r + '" fill="none" stroke="' + catVar(cat) + '" stroke-width="18" stroke-dasharray="' + Math.max(len - 1.5, 0) + ' ' + (C - Math.max(len - 1.5, 0)) + '" stroke-dashoffset="' + (-off) + '" transform="rotate(-90 70 70)"/>';
      off += len;
    });
    if (!tot) segs = '<circle cx="70" cy="70" r="' + r + '" fill="none" stroke="var(--surface-subtle)" stroke-width="18"/>';
    return '<svg class="donut" viewBox="0 0 140 140" role="img" aria-label="類別圓環圖">' + segs +
      '<text x="70" y="66" text-anchor="middle" class="lbl">' + sub + '</text><text x="70" y="84" text-anchor="middle" font-size="15" font-weight="700" class="num">' + center + '</text></svg>';
  }
  function catList(entries) {
    const tot = entries.reduce((s, x) => s + x[1], 0) || 1;
    return '<div class="catlist">' + entries.map(([c, v]) => '<div><i class="dot" style="background:' + catVar(c) + '"></i><span class="n">' + esc(c) + '</span><span class="v">' + twd(v) + '</span><span class="pct">' + Math.round(v / tot * 100) + '%</span></div>').join('') + '</div>';
  }

  /* ---------- HOME ---------- */
  function viewHome() {
    setTop('CzechMate', '捷適旅 · UI 樣稿', '<button class="iconbtn" data-act="settings" aria-label="設定">' + I.gear + '</button>');

    h += '<section><div class="sec-h"><h2>' + ymLabel(ym(TODAY)) + '花費</h2><button class="link" data-goto="stats">看統計 ›</button></div><div class="card summary">' +
      '<div class="big num"><small>NT$</small>' + Math.round(tot).toLocaleString('en-US') + '</div>' +
      '<div class="bar">' + cats.map(([c, v]) => '<i style="width:' + (v / tot * 100) + '%;background:' + catVar(c) + '"></i>').join('') + '</div>' +
      '<div class="legend">' + cats.slice(0, 3).map(([c, v]) => '<span><i class="dot" style="background:' + catVar(c) + '"></i>' + esc(c) + ' <b class="num">' + twd(v) + '</b></span>').join('') + '</div>' +
      pendingNote(month) + '</div>' +
      '<button class="btn btn-primary btn-block" data-act="add-exp">' + I.plus + '快速記一筆</button></section>';
    h += '<section><div class="sec-h"><h2>最近新增的資源</h2><button class="link" data-goto="lib">全部 ›</button></div>' + recent.map(r => resCard(r)).join('') + '</section>';
    return h;
  }

  /* ---------- LIBRARY ---------- */
  const TYPE_ICON = { '網站': I.globe, 'Dcard': I.chat, '筆記': I.note, '截圖': I.img, '文件': I.file };
  function hl(text, terms) {
    let t = esc(text);
    terms.forEach(w => { if (!w) return; const re = new RegExp('(' + w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi'); t = t.replace(re, '<mark>$1</mark>'); });
    return t;
  }
  function snippet(text, terms) {
    const low = text.toLowerCase();
    let i = -1;
    for (const w of terms) { i = low.indexOf(w.toLowerCase()); if (i >= 0) break; }
    if (i < 0) return text;
    const s = Math.max(0, i - 30);
    return (s > 0 ? '…' : '') + text.slice(s, i + 60) + (i + 60 < text.length ? '…' : '');
  }
  function resCard(r, terms) {
    terms = terms || [];
    const content = terms.length ? snippet(r.content, terms) : r.content;
    return '<button class="res" data-res="' + r.id + '"><span class="ticon">' + TYPE_ICON[r.type] + '</span><span class="body">' +
      '<span class="t">' + hl(r.title, terms) + (r.url ? I.link : '') + (r.img ? I.img : '') + (r.pinned ? I.pin : '') + '</span>' +
      '<span class="p">' + hl(content, terms) + '</span>' +
      '<span class="chips"><span class="chip ' + (r.stage === '旅遊' ? 'travel' : 'green') + '">' + r.stage + '</span>' + r.tags.map(t => '<span class="chip">#' + hl(t, terms) + '</span>').join('') +
      '<span class="date num">' + ymd(r.updated) + '</span></span></span></button>';
  }
  function viewLib() {
    setTop('資源庫', null, '<button class="iconbtn" data-act="settings" aria-label="設定">' + I.gear + '</button>');
    const terms = S.q.trim().split(/\s+/).filter(Boolean);
    const match = (hay) => terms.every(w => hay.toLowerCase().includes(w.toLowerCase()));
    let mine = resources.filter(r => (S.stage === '全部' || r.stage === S.stage) && (S.rtype === '全部' || r.type === S.rtype));
    if (terms.length) mine = mine.filter(r => match([r.title, r.content, r.tags.join(' '), r.url].join(' ')));
    mine.sort((a, b) => b.updated.localeCompare(a.updated));
    const hb = terms.length ? handbook.filter(h => match(h.page + ' ' + h.sec + ' ' + h.text)) : [];
    let h = '<div class="search">' + I.search + '<input id="q" type="search" placeholder="搜尋資源與生存手冊" value="' + esc(S.q) + '" autocomplete="off" aria-label="搜尋">' +
      (S.q ? '<button class="clear" data-act="clearq" aria-label="清除搜尋">✕</button>' : '') + '</div>';
    h += '<div class="scroller" role="group" aria-label="階段篩選">' + ['全部', '出發前', '抵達後', '旅遊', '不分'].map(s => '<button class="fchip" data-stage="' + s + '" aria-pressed="' + (S.stage === s) + '">' + s + '</button>').join('') + '</div>';
    h += '<div class="scroller" role="group" aria-label="類型篩選" style="margin-top:-12px">' + ['全部', '筆記', 'Dcard', '網站', '截圖'].map(s => '<button class="fchip" data-rtype="' + s + '" aria-pressed="' + (S.rtype === s) + '">' + (s === '全部' ? '所有類型' : s) + '</button>').join('') + '</div>';
    h += '<div class="sync">' + I.check + '生存手冊已同步 30 篇 · 2027/03/10 21:04（範例）</div>';
    h += '<section><div class="group-h">我的資源 <span class="n num">' + mine.length + ' 筆</span></div>';
    h += mine.length ? mine.map(r => resCard(r, terms)).join('') :
      '<div class="empty card"><span>找不到符合的資源，試試其他關鍵字或清除篩選條件。</span><button class="btn btn-secondary" data-act="clearall">清除條件</button></div>';
    h += '</section>';
    if (terms.length) {
      h += '<section><div class="group-h">' + I.book.replace('<svg', '<svg width="16" height="16"') + ' 生存手冊 <span class="n num">' + hb.length + ' 段</span></div>';
      h += hb.length ? hb.map(x => '<a class="res" href="' + x.url + '" target="_blank" rel="noopener" style="text-decoration:none;color:inherit"><span class="ticon book">' + I.book + '</span><span class="body"><span class="t" style="font-size:15px">' + hl(x.page, terms) + ' › ' + hl(x.sec, terms) + '</span><span class="p">' + hl(snippet(x.text, terms), terms) + '</span><span class="chips"><span class="chip">hackmd.io</span></span></span></a>').join('')
        : '<div class="muted small">手冊裡沒有相符的段落。</div>';
      h += '</section>';
    } else {
      h += '<p class="muted tiny" style="margin:-8px 0 0">試著搜尋「電信」、「簽證」或「ISIC」，會同時找出你的資源和生存手冊的段落。</p>';
    }
    h += '<div class="fab-spacer"></div><button class="fab" data-act="add-res">' + I.plus + '新增資源</button>';
    return h;
  }

  /* ---------- LEDGER ---------- */
  function viewLedger() {
    setTop('記帳', null, '<button class="iconbtn" data-act="settings" aria-label="設定">' + I.gear + '</button>');
    let h = '<div class="seg" role="group" aria-label="切換"><button data-lseg="exp" aria-pressed="' + (S.ledgerSeg === 'exp') + '">支出</button><button data-lseg="fx" aria-pressed="' + (S.ledgerSeg === 'fx') + '">換匯</button></div>';
    if (S.ledgerSeg === 'fx') return h + viewFx();
    h += '<div class="scroller" role="group" aria-label="期間">' + [['month', '本月'], ['all', '全部']].map(([k, n]) => '<button class="fchip" data-period="' + k + '" aria-pressed="' + (S.ledgerPeriod === k) + '">' + n + '</button>').join('') +
      '<span style="width:1px;background:var(--border);flex:none"></span>' +
      [['all', '全部模式']].concat(MODES.map(m => [m.id, m.name])).map(([k, n]) => '<button class="fchip" data-lmode="' + k + '" aria-pressed="' + (S.ledgerMode === k) + '">' + n + '</button>').join('') + '</div>';
    const p = pending();
    if (p.length) h += '<button class="banner" data-act="toggle-pending">' + I.alert + '<span>' + (S.pendingOnly ? '只顯示待補的 <b>' + p.length + ' 筆</b>' : '有 <b>' + p.length + ' 筆</b>刷卡待補帳單金額') + '</span><span class="go">' + (S.pendingOnly ? '顯示全部' : '只看待補') + ' ›</span></button>';
    let list = expenses.filter(e => (S.ledgerPeriod === 'all' || ym(e.date) === ym(TODAY)) && (S.ledgerMode === 'all' || e.mode === S.ledgerMode));
    if (S.pendingOnly) list = expenses.filter(e => e.src === '待補' && payOf(e.pay).type !== 'cash');
    list.sort((a, b) => b.date.localeCompare(a.date) || b.id.localeCompare(a.id));
    if (!list.length) return h + '<div class="empty card"><span>這段期間還沒有支出紀錄。</span><button class="btn btn-primary" data-act="add-exp">' + I.plus + '新增第一筆支出</button></div>';
    const days = {};
    list.forEach(e => { (days[e.date] = days[e.date] || []).push(e); });
    Object.keys(days).forEach(d => {
      const t = total(days[d]);
      h += '<section><div class="day-h num"><span>' + md(d) + ' ' + wd(d) + '</span><span>' + (t ? twd(t) : '') + '</span></div><div class="list">' + days[d].map(expRow).join('') + '</div></section>';
    });
    h += '<div class="fab-spacer"></div><button class="fab" data-act="add-exp">' + I.plus + '新增支出</button>';
    return h;
  }
  function viewFx() {
    let h = '<section><div class="sec-h"><h2>現金庫存</h2></div><div class="stocks">';
    Object.keys(stock).filter(c => Math.abs(stock[c]) > 0.001).forEach(c => {
      h += '<div class="stock' + (stock[c] < 0 ? ' neg' : '') + '"><span class="cur">' + c + ' 現金</span><span class="bal num">' + fmt(stock[c], c) + '</span><span class="avg num">平均 1 ' + c + ' = ' + avg[c].toFixed(c === 'HUF' ? 4 : 3) + ' TWD</span></div>';
    });
    h += '</div><p class="muted tiny" style="margin:0">用現金付外幣時，會用這裡的平均成本換算成台幣（移動平均）。</p></section>';

        '<span class="m"><span>' + ymd(f.date) + '</span><span>' + esc(f.place) + '</span>' + (f.method === 'atm' ? '<span class="chip warn">卡片提領 · ' + esc(card) + ' · 預估</span>' : '<span class="chip">現金換匯</span>') + '</span></span>' +
        '<span class="amt num"><span>1 ' + f.inCur + ' =</span><b>' + f.rate.toFixed(f.inCur === 'HUF' ? 4 : 3) + '</b><span>TWD</span></span></button>';
    });
    h += '</div></section><div class="fab-spacer"></div><button class="fab" data-act="add-fx">' + I.plus + '新增換匯</button>';
    return h;
  }

  /* ---------- STATS ---------- */
  function viewStats() {
    setTop('統計', null, '<button class="iconbtn" data-act="settings" aria-label="設定">' + I.gear + '</button>');
    let h = '<div class="seg" role="group" aria-label="檢視">' + [['month', '月份'], ['trip', '旅程'], ['pay', '付款方式']].map(([k, n]) => '<button data-sseg="' + k + '" aria-pressed="' + (S.statSeg === k) + '">' + n + '</button>').join('') + '</div>';
    if (S.statSeg !== 'trip') h += '<div class="scroller" role="group" aria-label="模式">' + [['all', '全部模式']].concat(MODES.map(m => [m.id, m.name])).map(([k, n]) => '<button class="fchip" data-smode="' + k + '" aria-pressed="' + (S.statMode === k) + '">' + n + '</button>').join('') + '</div>';
    const months = [...new Set(expenses.map(e => ym(e.date)))].sort();
    const mi = months.indexOf(S.statMonth);
    const monthNav = '<div class="monthnav"><button data-month="' + (months[mi - 1] || '') + '" aria-label="上個月"' + (mi <= 0 ? ' disabled' : '') + '>‹</button><b>' + ymLabel(S.statMonth) + '</b><button data-month="' + (months[mi + 1] || '') + '" aria-label="下個月"' + (mi >= months.length - 1 ? ' disabled' : '') + '>›</button></div>';
    const byMode = e => S.statMode === 'all' || e.mode === S.statMode;
    if (S.statSeg === 'month') {
      const list = expenses.filter(e => ym(e.date) === S.statMonth && byMode(e));
      const cats = sumByCat(list), tot = total(list);
      h += monthNav + '<div class="card summary"><span class="muted small">台幣總額（現金依換匯成本、刷卡依帳單金額）</span><div class="big num"><small>NT$</small>' + Math.round(tot).toLocaleString('en-US') + '</div>' + pendingNote(list) + '</div>';
      h += '<div class="card"><div class="donut-wrap">' + donut(cats, Math.round(tot).toLocaleString('en-US'), 'NT$') + catList(cats) + '</div></div>';
    } else if (S.statSeg === 'trip') {
      trips.slice().reverse().forEach(t => {
        const list = expenses.filter(e => e.trip === t.id), tot = total(list);
        const days = Math.round((new Date(t.end) - new Date(t.start)) / 864e5) + 1;
        const cats = sumByCat(list);
        h += '<button class="trip" data-trip="' + t.id + '" aria-expanded="' + (S.openTrip === t.id) + '"><span class="h"><span class="name">' + esc(t.name) + '</span><span class="total num">' + twd(tot) + '</span></span>' +
          '<span class="meta num"><span>' + ymd(t.start) + ' – ' + md(t.end) + '</span><span>' + days + ' 天</span><span>每日 ' + twd(tot / days) + '</span></span>' +
          '<span class="legend">' + cats.slice(0, 3).map(([c, v]) => '<span><i class="dot" style="background:' + catVar(c) + '"></i>' + esc(c) + ' <span class="num">' + twd(v) + '</span></span>').join('') + '</span>' + pendingNote(list) + '</button>';
        if (S.openTrip === t.id) h += '<div class="card"><div class="donut-wrap">' + donut(cats, Math.round(tot).toLocaleString('en-US'), 'NT$') + catList(cats) + '</div></div><div class="list">' + list.sort((a, b) => a.date.localeCompare(b.date)).map(expRow).join('') + '</div>';
      });
    } else {
      h += monthNav;
      PAYS.forEach(p => {
        const list = expenses.filter(e => e.pay === p.id && ym(e.date) === S.statMonth && byMode(e));
        if (!list.length) return;
        const by = {}; list.forEach(e => { by[e.cur] = (by[e.cur] || 0) + e.amt; });
        const billed = list.filter(e => e.src === '帳單' || (e.cur === 'TWD' && p.type !== 'cash')).reduce((s, e) => s + e.twd, 0);
        const pend = list.filter(e => e.src === '待補');
        const open = S.openPay === p.id;
        h += '<div class="list"><button class="row pay" data-pay="' + p.id + '" aria-expanded="' + open + '" style="align-items:stretch"><span class="h"><b>' + esc(p.name) + '</b><span class="muted tiny">' + list.length + ' 筆 ' + (open ? '▴' : '▾') + '</span></span>' +

  /* ---------- events ---------- */
  document.addEventListener('click', ev => {
    const b = ev.target.closest('button, a, [data-scrim]');
    if (!b) return;
    if (b.hasAttribute('data-scrim')) { if (ev.target === b) closeSheet(); return; }
    const d = b.dataset;
    if (d.tab) return go(d.tab);
    if (d.goto) return go(d.goto);
    if (d.open) return toast('會開啟 ' + d.open.replace('https://', ''));
    if (d.res) return openRes(d.res);
    if (d.edit) return openExpForm(d.edit);
    if (d.fx) return toast('樣稿：這裡會開啟換匯編輯');
    if (d.stage) { S.stage = d.stage; return render(); }
    if (d.rtype) { S.rtype = d.rtype; return render(); }
    if (d.lseg) { S.ledgerSeg = d.lseg; return render(); }
    if (d.period) { S.ledgerPeriod = d.period; S.pendingOnly = false; return render(); }
    if (d.lmode) { S.ledgerMode = d.lmode; S.pendingOnly = false; return render(); }
    if (d.sseg) { S.statSeg = d.sseg; return render(); }
    if (d.smode) { S.statMode = d.smode; return render(); }
    if (d.month !== undefined && d.month) { S.statMonth = d.month; return render(); }
    if (d.trip) { S.openTrip = S.openTrip === d.trip ? null : d.trip; return render(); }
    if (d.pay) { S.openPay = S.openPay === d.pay ? null : d.pay; return render(); }
    if (d.bill) {
      const v = parseFloat($('#bill-' + d.bill).value);
      if (!(v > 0)) return toast('請輸入有效金額，且金額必須大於 0。', false);
      expenses.find(e => e.id === d.bill).bill = v; render(); return toast('已補上帳單金額。');
    }
    if (d.themeSet) {
      if (d.themeSet === 'system') document.documentElement.removeAttribute('data-theme');
      else document.documentElement.setAttribute('data-theme', d.themeSet);
      try { localStorage.setItem('cm-theme', d.themeSet); } catch (e) {}
      return openSettings();
    }
    if (d.f && F) {
      readExpInputs();
      const prevMode = F.mode;
      F[d.f] = d.v;
      if (d.f === 'mode' && prevMode !== d.v) { F.cat = CATS[d.v][0]; F.trip = d.v === 'travel' ? (F.trip || 'vie') : null; }
      return drawExpForm();
    }
    if (d.x && FX) { readFx(); FX[d.x] = d.v; return drawFx(); }
    if (d.pick) {
      if (d.pick === 'rpin') { const on = b.getAttribute('aria-pressed') !== 'true'; b.setAttribute('aria-pressed', on); b.textContent = on ? '開' : '關'; return; }
      document.querySelectorAll('[data-pick="' + d.pick + '"]').forEach(x => x.setAttribute('aria-pressed', x === b));
      return;
    }
    switch (d.act) {
      case 'settings': return openSettings();
      case 'close': return closeSheet();
      case 'add-exp': return openExpForm(null);
      case 'save-exp': return saveExp();
      case 'del-ask': readExpInputs(); F.confirmDel = true; return drawExpForm();
      case 'del-cancel': F.confirmDel = false; return drawExpForm();
      case 'del-exp': { const i = expenses.findIndex(x => x.id === F.id); expenses.splice(i, 1); closeSheet(); render(); return toast('已刪除。'); }
      case 'new-trip': return toast('樣稿：這裡會輸入旅程名稱與日期');
      case 'add-fx': return openFxForm();
      case 'save-fx': {
        readFx();
        const o = parseFloat(FX.outAmt), i = parseFloat(FX.inAmt);
        if (!(o > 0 && i > 0)) return toast('請輸入有效金額，且金額必須大於 0。', false);
        if (FX.outCur === FX.inCur) return toast('換出與換入的幣別不能相同。', false);
        fx.push({ id: 'f' + (seq++), date: FX.date || TODAY, method: FX.method, card: FX.method === 'atm' ? FX.card : null, outAmt: o, outCur: FX.outCur, inAmt: i, inCur: FX.inCur, place: FX.place, note: '' });
        FX = null; closeSheet(); render(); return toast('已成功儲存，現金成本已重算。');
      }
      case 'add-res': return openResForm();
      case 'save-res': return saveRes();
      case 'pending': S.tab = 'ledger'; S.ledgerSeg = 'exp'; S.pendingOnly = true; render(); return window.scrollTo(0, 0);
      case 'toggle-pending': S.pendingOnly = !S.pendingOnly; return render();
      case 'export': return toast('樣稿：會產生 CzechMate_記帳_20270315.xlsx');
      case 'pins': return toast('樣稿：這裡可以調整常用連結順序');
      case 'clearq': S.q = ''; render(); return $('#q').focus();
      case 'clearall': S.q = ''; S.stage = '全部'; S.rtype = '全部'; return render();
      case 'demo': return toast(d.msg || '樣稿');
    }
  });
  document.addEventListener('compositionend', ev => {
    if (ev.target.id === 'q') ev.target.dispatchEvent(new Event('input', { bubbles: true }));
  });
  document.addEventListener('input', ev => {
    const t = ev.target;
    if (ev.isComposing) return;
    if (t.id === 'q') {
      S.q = t.value;
      const pos = t.selectionStart;
      render();
      const n = $('#q'); n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) {}
    } else if (t.id === 'f-amt' && F) {
      F.amtStr = t.value;
      $('#f-preview').innerHTML = cashPreview();
    } else if ((t.id === 'x-out' || t.id === 'x-in') && FX) {
      readFx();
      $('#x-rate').innerHTML = fxRate();
    }
  });
  document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && $('#sheet-root').innerHTML) closeSheet(); });

  try { const th = localStorage.getItem('cm-theme'); if (th === 'light' || th === 'dark') document.documentElement.setAttribute('data-theme', th); } catch (e) {}
  render();
})();
</script>
</body>
</html>
